<!DOCTYPE html><html lang="es"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Graficador de Funciones</title>

<link rel="stylesheet" href="style.css">

</head><body><header>
    <h1>📈 Graficador de Funciones</h1>
    <p>Grafica funciones de la forma <strong>f(x) = mx + b</strong></p>
</header>

<main>

    <section class="panel">

        <h2>Función lineal</h2>

        <div class="formula">

            f(x) =

            <input
                type="number"
                id="m"
                value="2"
                step="0.1"
            >

            x +

            <input
                type="number"
                id="b"
                value="1"
                step="0.1"
            >

        </div>

        <button onclick="graficar()">
            Graficar
        </button>

        <button
            class="limpiar"
            onclick="limpiar()"
        >
            Limpiar
        </button>

        <div class="resultado">

            <h3>Función:</h3>

            <p id="funcionMostrada">
                f(x) = 2x + 1
            </p>

            <h3>Datos:</h3>

            <p id="datos">
                Pendiente (m): 2
                <br>
                Intersección (b): 1
            </p>

        </div>

    </section>

    <section class="grafica-container">

        <canvas id="grafica"></canvas>

    </section>

</main>

<footer>

    <p>
        Graficador de funciones © 2026
    </p>

</footer>

<script src="script.js"></script>

</body></html>
